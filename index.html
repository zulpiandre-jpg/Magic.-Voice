<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Voice AI Studio</title>
<style>
:root{--bg:#0b1020;--card:#121a30;--line:#25304f;--ink:#e8eefc;--mute:#8d9ab8;--g:#10b981;--o:#ff7a52;--err:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:16px 14px 60px;max-width:720px;margin:auto}
h1{font-size:24px;margin:6px 0}h1 span{color:var(--g)}p.s{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);padding:12px;border-radius:12px;font-weight:700;cursor:pointer}
button.on,.big{background:var(--g);border-color:var(--g);color:#04170f}
.big{width:100%;padding:15px;font-size:16px;margin-top:14px}.big:disabled{opacity:.5}
.o{background:var(--o);border-color:var(--o);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:700}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:#0d1426;border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:130px;resize:vertical}input[type=range]{width:100%;accent-color:var(--g)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chips{display:flex;gap:6px;margin-bottom:6px}.chips button{padding:6px 14px;border-radius:99px;flex:none;font-size:13px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:4px}
.sl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.err{color:var(--err);margin-top:12px;white-space:pre-wrap}.ok{color:var(--g)}
.res{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#0d1426}
.res b{color:var(--g)}.res p{margin:4px 0 8px;color:var(--mute);font-size:13px}audio{width:100%}
a.dl{display:inline-block;margin-top:8px;color:var(--g);font-weight:700}
.hide{display:none}details{margin-bottom:14px}summary{cursor:pointer;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}.chk input{width:auto}
</style></head><body>
<h1>🎙️ Magic Voice <span>AI Studio</span></h1>
<p class="s">Naskah jadi Voice Over AI (.WAV) untuk TikTok, Reels, dan YouTube.</p>

<details class="card" id="apiBox"><summary>⚙️ Pengaturan API Key</summary>
<label>Gemini API Key</label><input type="password" id="key" placeholder="Tempel API key dari Google AI Studio">
<button style="margin-top:10px;width:100%" onclick="saveKey()">Simpan</button>
<div id="keyMsg" class="meta"></div>
<div class="meta">Key hanya disimpan di browser HP ini.</div></details>

<div class="tabs"><button id="t1" class="on" onclick="tab(1)">✍️ Text to Voice</button><button id="t2" onclick="tab(2)">📦 Produk → Naskah</button></div>

<div id="p2" class="card hide">
<b>Buat naskah VO dari produk</b>
<label>Nama / deskripsi produk</label><input type="text" id="pn" placeholder="Contoh: Powerbank 10.000mAh 22.5W">
<label>Keunggulan utama (USP)</label><textarea id="pu" style="min-height:90px" placeholder="Contoh: fast charging, output dua, ada layar persen"></textarea>
<div class="row"><div><label>Jumlah scene</label><select id="pc"><option>1</option><option>2</option><option>3</option></select></div>
<div><label>Gaya hook</label><select id="ph"><option value="bebas">Bebas (AI pilih)</option><option value="pertanyaan yang menyentil">Pertanyaan nyentil</option><option value="fakta yang mengejutkan">Fakta kejut</option><option value="masalah yang relatable langsung">Problem hook</option><option value="rasa penasaran">Penasaran</option></select></div></div>
<button class="big" id="gs" onclick="genScript()">✨ Buat Naskah</button><div id="e2" class="err"></div></div>

<div id="p1" class="card">
<b>Text to Voice Studio</b>
<label>Naskah / teks (pisahkan scene dengan baris kosong)</label>
<textarea id="tx" placeholder="Scene 1...&#10;&#10;Scene 2..."></textarea>
<div class="meta"><span id="cnt">0 kata</span><span id="est"></span></div>

<label>Karakter suara</label>
<div class="chips"><button class="on" data-f="all">Semua</button><button data-f="P">P</button><button data-f="L">L</button></div>
<div class="row"><select id="vc"></select><button style="flex:none" onclick="testVoice()" id="tv">▶ Tes</button></div>

<label>Gaya bicara / intonasi</label><select id="st"></select>
<div class="chk"><input type="checkbox" id="auto"><label style="margin:0;text-transform:none;font-size:14px;color:var(--ink)">Intonasi otomatis per scene (pembuka penasaran, tengah edukatif, penutup CTA)</label></div>
<label>Arahan tambahan (opsional)</label><input type="text" id="cs" placeholder="Contoh: sedikit tertawa di awal">

<label>Model</label><select id="md"><option value="gemini-3.8-flash-tts">Gemini 3.8 Flash TTS (kualitas terbaik)</option><option value="gemini-3.8-flash-lite-tts">Gemini 3.8 Flash-Lite TTS (cepat)</option></select>

<div class="sl"><span>Volume</span><span id="vv">100%</span></div><input type="range" id="vol" min="30" max="150" value="100">
<div class="sl"><span>Nada (pitch)</span><span id="pv">50</span></div><input type="range" id="pit" min="0" max="100" value="50">
<div class="sl"><span>Kecepatan</span><span id="sv">50</span></div><input type="range" id="spd" min="0" max="100" value="50">

<button class="big" id="go" onclick="generate()">🎙️ Ucapkan &amp; Buat File Audio (.WAV)</button>
<div id="e1" class="err"></div><div id="out"></div></div>

<script>
const $=id=>document.getElementById(id);
const S={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const MODELS=["gemini-3.8-flash-tts","gemini-3.8-flash-lite-tts"];
const VOICES=[["Puck","L","Energik"],["Zephyr","P","Cerah"],["Charon","L","Informatif"],["Kore","P","Tegas"],["Fenrir","L","Bersemangat"],["Leda","P","Muda"],["Orus","L","Tegas"],["Aoede","P","Ringan"],["Callirrhoe","P","Santai"],["Autonoe","P","Cerah"],["Enceladus","L","Berbisik"],["Iapetus","L","Jernih"],["Umbriel","L","Santai"],["Algieba","L","Halus"],["Despina","P","Halus"],["Erinome","P","Jernih"],["Algenib","L","Serak"],["Rasalgethi","L","Informatif"],["Laomedeia","P","Ceria"],["Achernar","P","Lembut"],["Alnilam","L","Tegas"],["Schedar","L","Rata"],["Gacrux","P","Dewasa"],["Pulcherrima","P","Maju"],["Achird","L","Ramah"],["Zubenelgenubi","L","Santai"],["Vindemiatrix","P","Lembut"],["Sadachbia","L","Hidup"],["Sadaltager","L","Berpengetahuan"],["Sulafat","P","Hangat"]];
const STY={energik:["Energik ramah","energetic and friendly, upbeat, warm smile in the voice"],penasaran:["Penasaran","curious and intrigued, building excitement"],tegas:["Tegas meyakinkan","confident, assertive and convincing, punchy delivery"],premium:["Premium sinematik","premium cinematic, smooth, elegant, slightly slower"],santai:["Santai ngobrol","relaxed casual chat like telling a friend, natural"],edukatif:["Edukatif jelas","clear and educational, steady pace, easy to follow"],empatik:["Empatik masalah → solusi","empathetic about the problem, then relieved and hopeful about the solution"],cta:["CTA mantap","firm upbeat call to action, confident closing with rising energy"],promo:["Iklan promosi","enthusiastic, crisp, persuasive advertising delivery"]};
const BASE="Speak natural casual Indonesian in a gue-lu street-smart anak muda style. ";

// init
$("st").innerHTML=Object.entries(STY).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("");
function fillVoices(f="all"){const cur=S.get("mv_voice","Puck");$("vc").innerHTML=VOICES.filter(v=>f==="all"||v[1]===f).map(v=>`<option value="${v[0]}">${v[0]} – ${v[1]==="P"?"Perempuan":"Laki-laki"} (${v[2]})</option>`).join("");if([...$("vc").options].some(o=>o.value===cur))$("vc").value=cur}
fillVoices();
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chips button").forEach(x=>x.classList.remove("on"));b.classList.add("on");fillVoices(b.dataset.f)});
$("key").value=S.get("mv_key","");$("tx").value=S.get("mv_text","");$("st").value=S.get("mv_style","energik");$("md").value=S.get("mv_model",MODELS[0]);$("cs").value=S.get("mv_custom","");$("auto").checked=S.get("mv_auto","0")==="1";
if(!$("key").value)$("apiBox").open=true;
["vc","st","md"].forEach(i=>$(i).onchange=()=>S.set({vc:"mv_voice",st:"mv_style",md:"mv_model"}[i],$(i).value));
$("cs").oninput=()=>S.set("mv_custom",$("cs").value);$("auto").onchange=()=>S.set("mv_auto",$("auto").checked?"1":"0");
function saveKey(){S.set("mv_key",$("key").value.trim());$("keyMsg").innerHTML='<span class="ok">✔ Tersimpan</span>';$("apiBox").open=false}
function tab(n){$("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2)}
const scenes=()=>$("tx").value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
function upd(){const t=$("tx").value;S.set("mv_text",t);const sc=scenes();const w=t.trim()?t.trim().split(/\s+/).length:0;$("cnt").textContent=w+" kata • "+sc.length+" scene";
 $("est").textContent=sc.map(s=>"~"+Math.round(s.split(/\s+/).length/2.6)+" dtk").join(" | ")}
$("tx").oninput=upd;upd();
[["vol","vv","%"],["pit","pv",""],["spd","sv",""]].forEach(([a,b,u])=>$(a).oninput=()=>$(b).textContent=$(a).value+u);

// helpers
function styleFor(k,i,n){let key=k;if($("auto").checked&&n>1)key=i===0?"penasaran":i===n-1?"cta":"edukatif";
 let s=BASE+STY[key][1];const sp=+$("spd").value,pt=+$("pit").value;
 if(sp<35)s+=", speak slowly";else if(sp>65)s+=", speak at a fast lively pace";
 if(pt<35)s+=", lower pitch";else if(pt>65)s+=", higher pitch";
 const c=$("cs").value.trim();if(c)s+=", "+c;return s}
const b2u=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
function wrapPcm(pcm,rate){const h=new ArrayBuffer(44),d=new DataView(h),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
 w(0,"RIFF");d.setUint32(4,36+pcm.length,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,rate,true);d.setUint32(28,rate*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,pcm.length,true);
 const o=new Uint8Array(44+pcm.length);o.set(new Uint8Array(h));o.set(pcm,44);return o}
function toWav(bytes,mime){const riff=bytes[0]===82&&bytes[1]===73&&bytes[2]===70&&bytes[3]===70;if(riff)return bytes;const m=/rate=(\d+)/.exec(mime||"");return wrapPcm(bytes,m?+m[1]:24000)}
function gain(w,g){if(Math.abs(g-1)<.01)return w;const d=new DataView(w.buffer,w.byteOffset,w.byteLength);let p=12,off=-1,len=0,bits=16;
 while(p+8<=w.length){const id=String.fromCharCode(w[p],w[p+1],w[p+2],w[p+3]),sz=d.getUint32(p+4,true);if(id==="fmt ")bits=d.getUint16(p+22,true);if(id==="data"){off=p+8;len=Math.min(sz,w.length-off);break}p+=8+sz+(sz%2)}
 if(off<0||bits!==16)return w;for(let i=off;i+1<off+len;i+=2){let v=Math.round(d.getInt16(i,true)*g);d.setInt16(i,Math.max(-32768,Math.min(32767,v)),true)}return w}
function friendly(e){const m=e.message||String(e);if(/API key/i.test(m)&&(e.status===400||e.status===403))return"API key tidak valid atau belum diaktifkan. Cek lagi di Pengaturan API Key.";
 if(e.status===429)return"Kuota/batas permintaan tercapai. Tunggu 1 menit lalu coba lagi.\n"+m;if(e.status===403)return"Akses ditolak (key tidak punya izin atau wilayah tidak didukung).\n"+m;return m}
async function api(model,body){const key=S.get("mv_key","");if(!key)throw new Error("API key belum diisi. Buka Pengaturan API Key di atas.");
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok){const m=j.error&&j.error.message||r.statusText;const e=new Error(m);e.status=r.status;e.retry=r.status===404||/no longer available|not found|not supported|not available|deprecated/i.test(m);throw e}return j}
async function tts(text,voice,style,pref){const order=[pref,...MODELS.filter(m=>m!==pref)];let last;
 for(const m of order){try{const j=await api(m,{contents:[{role:"user",parts:[{text,speech_metadata:{style}}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}}});
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];const p=parts.find(x=>x.inlineData||x.inline_data);
  if(!p){const why=(j.candidates&&j.candidates[0]&&j.candidates[0].finishReason)||(j.promptFeedback&&j.promptFeedback.blockReason)||"tidak ada audio";throw new Error("Audio tidak dihasilkan ("+why+"). Coba perpendek atau ubah naskah.")}
  const d=p.inlineData||p.inline_data;return{wav:toWav(b2u(d.data),d.mimeType||d.mime_type),model:m}}catch(e){last=e;if(!e.retry)throw e}}throw last}
function blobUrl(w){return URL.createObjectURL(new Blob([w],{type:"audio/wav"}))}

async function generate(){const sc=scenes();$("e1").textContent="";$("out").innerHTML="";
 if(!sc.length){$("e1").textContent="Naskah masih kosong.";return}
 const btn=$("go");btn.disabled=true;const voice=$("vc").value,k=$("st").value,g=$("vol").value/100;
 try{for(let i=0;i<sc.length;i++){btn.textContent=`⏳ Membuat scene ${i+1} dari ${sc.length}...`;
  const r=await tts(sc[i],voice,styleFor(k,i,sc.length),$("md").value);const w=gain(r.wav,g);const u=blobUrl(w);
  const div=document.createElement("div");div.className="res";
  div.innerHTML=`<b>Scene ${i+1}</b> <span class="meta" style="display:inline">• ${r.model}</span><p></p><audio controls src="${u}"></audio><a class="dl" href="${u}" download="voiceover-scene-${i+1}.wav">⬇ Unduh WAV</a>`;
  div.querySelector("p").textContent=sc[i];$("out").appendChild(div)}}
 catch(e){$("e1").textContent="Gagal memproses: "+friendly(e)}
 btn.disabled=false;btn.textContent="🎙️ Ucapkan & Buat File Audio (.WAV)"}

async function testVoice(){const b=$("tv");b.disabled=true;$("e1").textContent="";
 try{const r=await tts("Halo, ini contoh suara gue buat video lo.",$("vc").value,BASE+STY[$("st").value][1],$("md").value);new Audio(blobUrl(r.wav)).play()}
 catch(e){$("e1").textContent="Suara ini gagal dites: "+friendly(e)}b.disabled=false}

async function genScript(){const n=$("pn").value.trim();$("e2").textContent="";if(!n){$("e2").textContent="Isi nama produk dulu.";return}
 const b=$("gs");b.disabled=true;b.textContent="⏳ Menulis naskah...";const c=$("pc").value,h=$("ph").value;
 const prompt=`Tulis naskah voice over video affiliate TikTok berbahasa Indonesia gaya santai gue-lu (pakai "lo", bukan "kamu").
Produk: ${n}
Keunggulan: ${$("pu").value.trim()||"(tidak disebutkan, jangan mengarang fitur)"}
Jumlah scene: ${c}. Tiap scene dibacakan sekitar 10 detik (sekitar 22-28 kata), natural, cepat, dan santai.
Scene pertama harus diawali hook ${h==="bebas"?"yang kuat dan beragam":h}. Scene terakhir ditutup ajakan checkout yang menarik.
ATURAN KERAS: jangan sebut harga atau angka rupiah, diskon, stok terbatas, PO, link, bio, kata "keranjang kuning", atau nama platform lain. Jangan berlebihan atau bohong, hanya fitur yang disebutkan. Tanpa emoji, tanpa label scene, tanpa tanda kutip.
Keluarkan HANYA teks naskah, setiap scene dipisah satu baris kosong.`;
 try{const j=await api("gemini-3.8-flash",{contents:[{role:"user",parts:[{text:prompt}]}]});
  const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").replace(/[*#`]/g,"").replace(/^\s*(scene\s*\d+\s*[:.-]?)/gim,"").trim();
  if(!t)throw new Error("Naskah kosong, coba lagi.");$("tx").value=t;upd();S.set("mv_text",t);tab(1)}
 catch(e){$("e2").textContent="Gagal: "+friendly(e)}b.disabled=false;b.textContent="✨ Buat Naskah"}
</script></body></html>
