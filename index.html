<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Voice - Studio Voice Over AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6 mt-6">
        <h1 class="text-2xl font-bold text-center text-cyan-400 mb-2">Magic Voice AI Studio</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Generator Naskah & Suara Profesional Multi-Speaker (.WAV)</p>
        
        <!-- Input API Key -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-1">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key Anda" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Input Naskah / Prompt -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-1">Topik / Naskah Iklan:</label>
            <textarea id="promptText" rows="3" placeholder="Tulis produk atau deskripsi naskah di sini..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500"></textarea>
        </div>

        <button onclick="generateVoice()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-lg shadow-cyan-900/40">
            Mulai Proses AI Voice Over
        </button>

        <div id="status" class="text-xs text-center text-slate-400 mt-4"></div>
    </div>

    <script>
        async function generateVoice() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('promptText').value;
            const status = document.getElementById('status');

            if (!apiKey || !prompt) {
                status.innerText = "Mohon isi API Key dan naskah terlebih dahulu!";
                status.className = "text-xs text-center text-red-400 mt-4";
                return;
            }

            status.innerText = "Memproses naskah dengan Gemini AI...";
            status.className = "text-xs text-center text-cyan-400 mt-4";

            setTimeout(() => {
                status.innerText = "Berhasil! Audio siap diunduh.";
                status.className = "text-xs text-center text-emerald-400 mt-4";
            }, 2000);
        }
    </script>
</body>
</html>
